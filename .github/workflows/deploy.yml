name: Deploy to Coolify
'on':
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
jobs:
  trigger-coolify:
    runs-on: ubuntu-latest
    steps:
      - name: Join Tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: '${{ secrets.TS_OAUTH_CLIENT_ID }}'
          oauth-secret: '${{ secrets.TS_OAUTH_SECRET }}'
          tags: 'tag:ci'
          version: latest
      - name: 'Forward event to Coolify (private, over Tailscale)'
        env:
          COOLIFY_HOST: '${{ secrets.COOLIFY_HOST }}'
          WEBHOOK_SECRET: '${{ secrets.COOLIFY_WEBHOOK_SECRET }}'
          EVENT_NAME: '${{ github.event_name }}'
        run: >
          set -euo pipefail

          BODY_FILE="$GITHUB_EVENT_PATH"

          SIGNATURE=$(openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" "$BODY_FILE"
          | sed 's/^.* //')


          curl -sS --fail \
            -X POST "http://${COOLIFY_HOST}/webhooks/source/github/events/manual" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: ${EVENT_NAME}" \
            -H "X-Hub-Signature-256: sha256=${SIGNATURE}" \
            --data-binary "@${BODY_FILE}"
